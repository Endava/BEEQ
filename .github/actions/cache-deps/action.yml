name: Get & Cache dependencies
description: Get the dependencies (via pnpm) and cache them

inputs:
  caching:
    description: Whether to cache the dependencies or not.
    required: false
    default: 'true'

runs:
  using: composite
  steps:
    - name: 💫 Cache dependencies
      if: inputs.caching == 'true'
      id: cache
      uses: actions/cache@v6
      with:
        path: node_modules
        key: ${{ runner.os }}-${{ runner.arch }}-node-modules-${{ hashFiles('mise.toml', 'package.json', 'pnpm-lock.yaml') }}
    - name: 📦 Install dependencies
      run: pnpm install --frozen-lockfile --ignore-scripts --prefer-offline
      shell: bash
