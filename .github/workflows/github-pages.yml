name: Update Storybook (via GitHub Pages)

on: workflow_dispatch

env:
  NX_CLOUD_ACCESS_TOKEN: ${{ secrets.NX_CLOUD_ACCESS_TOKEN }}

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  main:
    name: 📘 Storybook deploy
    runs-on: ubuntu-latest
    env:
      NX_BRANCH: ${{ github.head_ref || github.ref_name }}
    steps:
      - name: 🛎 Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: 🛠 Setup mise
        uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492 # v5.0.1
        with:
          version: '2026.9.18'

      - name: 🔎 Check Node and PNPM versions
        run: |
          node --version
          pnpm --version

      - name: 💫 Load and cache dependencies
        uses: ./.github/actions/cache-deps

      - name: 🚚 Deploy BEEQ Storybook to GitHub Pages
        uses: bitovi/github-actions-storybook-to-github-pages@ddd9d35f670cceedd2bfc444be681001b0709730 # v1.0.4
        with:
          build_command: pnpm build:storybook
          checkout: false
          install_command: pnpm install --frozen-lockfile --ignore-scripts --prefer-offline
          path: ./dist/storybook/beeq
