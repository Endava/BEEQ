name: NPM preview publish

# Publishes the branch picked in "Use workflow from" as X.Y.Z-preview.N under the `preview` dist-tag.
# It never commits, tags, creates a GitHub release or deploys Storybook.
# npm needs a trusted publisher for this file on every package (see "Preview releases" in CONTRIBUTING.md).
on:
  workflow_dispatch: # Allows manual triggering
    inputs:
      dry_run:
        description: 'Run npm publish in dry-run mode'
        type: boolean
        default: false

# Previews serialize among themselves so two runs can't pick the same preview number
concurrency:
  group: npm-publish-preview
  cancel-in-progress: false

env:
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  NX_CLOUD_ACCESS_TOKEN: ${{ secrets.NX_CLOUD_ACCESS_TOKEN }}

permissions:
  contents: read
  id-token: write

jobs:
  main:
    name: 📦 NPM preview publish
    runs-on: ubuntu-latest
    env:
      NX_BRANCH: ${{ github.ref_name }}
    steps:
      - name: 🧪 Check preview runs from a branch
        if: github.ref_type != 'branch'
        run: |
          echo "::error::Preview releases must run from a branch (current ref: $GITHUB_REF)"
          exit 1
        shell: bash

      - name: 🛎 Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: 🔑 Check GH_TOKEN
        uses: ./.github/actions/check-token
        with:
          GITHUB_TOKEN: $GH_TOKEN

      - name: 🛠 Setup mise
        uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492 # v5.0.1
        with:
          version: '2026.9.18'

      - name: 🔎 Check Node and PNPM versions
        run: |
          node --version
          pnpm --version

      - name: 💫 Load and cache dependencies
        uses: ./.github/actions/cache-deps

      - name: 🏷 Bump packages to the next preview version
        id: preview
        run: node tools/scripts/prerelease.mjs --preid preview
        shell: bash

      - name: ⏳ Build
        run: pnpm build
        shell: bash

      - name: 🚀 Publish BEEQ preview to NPM registry
        run: pnpm exec nx release publish --parallel=5 --output-style=static --tag preview $DRY_RUN_FLAG
        shell: bash
        env:
          NPM_CONFIG_PROVENANCE: true
          DRY_RUN_FLAG: ${{ inputs.dry_run && '--dry-run' || '' }}

      - name: 📝 Summarize the preview
        run: |
          {
            printf '## 📦 BEEQ preview `%s`\n\n' "$VERSION"
            if [ "$DRY_RUN" = 'true' ]; then
              printf '**Dry run:** nothing was published to npm.\n\n'
            fi
            printf -- '- npm dist-tag: `preview`\n'
            printf -- '- Branch: `%s`\n' "$GITHUB_REF_NAME"
            printf -- '- Commit: %s/%s/commit/%s\n\n' "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_SHA"
            printf 'Install the exact version, for example `npm install @beeq/core@%s`. ' "$VERSION"
            printf 'The `preview` dist-tag moves to every new preview, whichever branch published it.\n'
          } >> "$GITHUB_STEP_SUMMARY"
        shell: bash
        env:
          VERSION: ${{ steps.preview.outputs.version }}
          DRY_RUN: ${{ inputs.dry_run }}
