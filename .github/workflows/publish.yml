name: NPM publish and Storybook deploy

on:
  workflow_dispatch: # Allows manual triggering
  release:
    types: [published] # Triggers on release publish

env:
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  NX_CLOUD_ACCESS_TOKEN: ${{ secrets.NX_CLOUD_ACCESS_TOKEN }}

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  main:
    name: 📦 NPM publish and 📘 Storybook deploy
    runs-on: ubuntu-latest
    env:
      NX_BRANCH: ${{ github.head_ref || github.ref_name }}
    steps:
      - name: 🛎 Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: 🔑 Check GH_TOKEN
        uses: ./.github/actions/check-token
        with:
          GITHUB_TOKEN: $GH_TOKEN

      - name: 🛠 Setup mise
        uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492 # v5.0.1
        with:
          version: '2026.9.18'

      - name: 🔎 Check Node and PNPM versions
        run: |
          node --version
          pnpm --version

      - name: 💫 Load and cache dependencies
        uses: ./.github/actions/cache-deps

      - name: ⏳ Build
        run: pnpm build
        shell: bash

      - name: 🚀 Publish BEEQ to NPM registry
        run: pnpm exec nx release publish --parallel=5 --output-style=stream
        env:
          NPM_CONFIG_PROVENANCE: true

      - name: 🚚 Deploy BEEQ Storybook to GitHub Pages
        uses: bitovi/github-actions-storybook-to-github-pages@ddd9d35f670cceedd2bfc444be681001b0709730 # v1.0.4
        with:
          build_command: pnpm build:storybook
          checkout: false
          install_command: pnpm install --frozen-lockfile --ignore-scripts --prefer-offline
          path: ./dist/storybook/beeq
