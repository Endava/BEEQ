name: Skills check

# CircleCI runs the Nx side: `nx sync:check` plus check, typecheck, test, and
# eval-validate for beeq-skills and tools. This workflow covers what Nx cannot:
# what `npx skills` finds when a consumer installs from this repo.
on:
  pull_request:
    paths:
      - 'skills/**'
      - '.agents/skills/**'
      - '.github/workflows/skills-check.yml'
      - 'mise.toml'
      - 'package.json'

permissions:
  contents: read

concurrency:
  group: skills-check-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  check:
    name: 🧩 Check skill discovery
    runs-on: ubuntu-latest
    env:
      DISABLE_TELEMETRY: 1
      NO_COLOR: 1
    steps:
      - name: 🛎 Checkout
        uses: actions/checkout@v7

      - name: 🛠 Setup mise
        uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492 # v5.0.1
        with:
          version: '2026.9.18'

      - name: 📦 npx skills lists only public skills
        run: |
          public=$(npx --yes --ignore-scripts skills@1.7.0 add . --list 2>&1)
          echo "$public"
          echo "$public" | grep -q "Found 1 skill" || { echo "::error::Expected exactly one public skill (beeq)."; exit 1; }
          echo "$public" | grep -qw "beeq" || { echo "::error::The beeq skill is not discoverable."; exit 1; }

          expected=$(( $(ls .agents/skills/*/SKILL.md | wc -l) + 1 ))
          all=$(INSTALL_INTERNAL_SKILLS=1 npx --yes --ignore-scripts skills@1.7.0 add . --list 2>&1)
          echo "$all" | grep -q "Found ${expected} skills" || { echo "::error::Expected ${expected} skills with INSTALL_INTERNAL_SKILLS=1."; exit 1; }
