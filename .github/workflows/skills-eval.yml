name: Skills eval

on:
  workflow_dispatch:
    inputs:
      agent:
        description: Coding agent that runs the tasks
        type: choice
        options: [claude, copilot]
        default: claude
      configuration:
        description: beeq-skills:eval configuration (smoke 5 trials on smoke tasks, reliable 15, regression 30)
        type: choice
        options: [smoke, reliable, regression]
        default: smoke
      model:
        description: Model ID for the agent (empty uses the agent default)
        type: string
        default: ''
      eval:
        description: Comma-separated task names (empty runs every task in the configuration)
        type: string
        default: ''
      threshold:
        description: Fail when the with-skill mean reward is below this (empty never fails)
        type: string
        default: '0.8'

permissions:
  contents: read

jobs:
  eval:
    name: 🧪 Evaluate the beeq skill
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      VOLTA_FEATURE_PNPM: 1
      DISABLE_TELEMETRY: 1
      NO_COLOR: 1
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
      AGENT: ${{ inputs.agent }}
      CONFIGURATION: ${{ inputs.configuration }}
      MODEL: ${{ inputs.model }}
      EVALS: ${{ inputs.eval }}
      THRESHOLD: ${{ inputs.threshold }}
    steps:
      - name: 🛎 Checkout
        uses: actions/checkout@v6

      - name: 🛠 Setup Volta
        uses: volta-cli/action@v5

      - name: 💫 Load and cache dependencies
        uses: ./.github/actions/cache-deps

      - name: 🤖 Install the agent CLI
        run: |
          if [ "$AGENT" = claude ]; then npm install -g @anthropic-ai/claude-code; else npm install -g @github/copilot; fi

      - name: 🧪 Run evals
        run: |
          args=(--configuration="$CONFIGURATION" --agent="$AGENT")
          if [ -n "$MODEL" ]; then args+=(--model="$MODEL"); fi
          if [ -n "$EVALS" ]; then args+=(--eval="$EVALS"); fi
          if [ -n "$THRESHOLD" ]; then args+=(--threshold="$THRESHOLD"); fi
          pnpm exec nx run beeq-skills:eval "${args[@]}"

      - name: 📤 Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: skill-eval-${{ inputs.agent }}-${{ inputs.configuration }}-${{ github.run_id }}
          path: tmp/skill-evals/
          if-no-files-found: warn
