name: destructive-confirm
metadata:
  stack: react
  tags: [patterns]
instruction: >-
  Add a Delete workspace action to a React settings page. Deleting cannot be undone, so ask the user
  to confirm first.
workspace:
  - src: '{{evals}}/fixtures/react'
    dest: .
expected:
  criteria: >-
    Only the destructive actions use the danger variant; Cancel is secondary. The confirmation copy
    names the workspace and states that the action cannot be undone. The dialog is opened and closed
    with its documented methods or props.
  checks:
    - name: danger-variant
      match: 'variant=["'']danger["'']'
